services:
  - type: web
    name: wart-faucet
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NETWORK
        value: mainnet
      - key: NODE_URL
        value: https://node.wartscan.io
      - key: DRIP_AMOUNT
        value: "2"
      - key: WEEKLY_BUDGET
        value: "100"
      - key: MIN_RESERVE
        value: "1"
      - key: TRUST_PROXY
        value: "true"
      - key: FAUCET_HEX_PRIVKEY
        sync: false
